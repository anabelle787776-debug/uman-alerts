name = "umania-telegram"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Check NEPTUN once a minute
[triggers]
crons = ["* * * * *"]

[vars]
# Public channel username, e.g. "@umania_alerts" (set once the channel exists)
CHANNEL = "@umania_alerts"

# State between runs (which alerts/threats were already announced)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# The bot token is NOT stored here. Add it in the Cloudflare dashboard as a secret named BOT_TOKEN.
